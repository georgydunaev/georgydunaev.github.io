<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Georgy Dunaev | Personal Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        #portal-switch-banner {
            height: 40px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        .portal-brand {
            font-weight: 700;
            font-size: 13.5px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .portal-tag {
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .switch-link {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .switch-link:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
        }

        iframe.completeiframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
<link rel="icon" type="image/png" href="myfavicon-96x96.png" sizes="96x96" />
